name: Build, Test and Publish to Github and Play Store

permissions:
  contents: write
  packages: read

on:
  push:
    tags:
      - 'v*' # Trigger on new tags (e.g., v1.0.0)
  workflow_dispatch:
    inputs:
      reason:
        description: Why did you trigger this workflow run manually?
        required: true
        default: Need a new build.
        type: string
      tag:
        description: Which tag to build from?
        required: true
        default: v0.1.19
        type: string

jobs:
  release-github:
    runs-on: ubuntu-latest
    environment:
      name: "Google Play API access"
      deployment: false
    env:
      WWWALLET_ANDROID_APPLICATION_ID: ${{ vars.WWWALLET_ANDROID_APPLICATION_ID }}
      WWWALLET_ANDROID_KEY_ALIAS: ${{ secrets.WWWALLET_ANDROID_KEY_ALIAS }}
      WWWALLET_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.WWWALLET_ANDROID_RELEASE_KEY_ALIAS }}
      WWWALLET_ANDROID_KEY_PASSWORD: ${{ secrets.WWWALLET_ANDROID_KEY_PASSWORD }}
      WWWALLET_ANDROID_STORE_PASSWORD: ${{ secrets.WWWALLET_ANDROID_STORE_PASSWORD }}
      WWWALLET_ANDROID_STORE_B64: ${{ secrets.WWWALLET_ANDROID_STORE_B64 }}
      FACETEC_API_BEARER_TOKEN: ${{ secrets.FACETEC_API_BEARER_TOKEN }}
      ANDROID_TARGET_SDK: ${{ vars.ANDROID_TARGET_SDK }}
      ANDROID_BUILD_TOOLS: ${{ vars.ANDROID_BUILD_TOOLS }}
      ANDROID_CMDLINE_TOOLS: ${{ vars.ANDROID_CMDLINE_TOOLS }}
      GITHUB_ACTOR: sirospackages
      GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      GCP_JSON_KEY: ${{ secrets.GCP_JSON_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # https://github.com/android-actions/setup-android
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS }}
          packages: 'platform-tools platforms;android-${{ env.ANDROID_TARGET_SDK }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Add build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}" >> $GITHUB_PATH

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Code Style
        run: ./gradlew ktlintCheck

      - name: Test
        run: ./gradlew assemble check

      - name: Fingerprints
        run: ./gradlew checkFingerPrints

      - name: Create release notes
        run: ./gradlew createReleaseNotes

      - name: Prepare release artifacts
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          
          mkdir -p release-assets
          
          cp ./wrapper/build/outputs/apk/release/wrapper-release.apk \
             ./release-assets/wwwallet-${TAG}.apk
          
          cp ./wrapper/build/outputs/apk/debug/wrapper-debug.apk \
             ./release-assets/wwwallet-debug-${TAG}.apk

      - name: Create GitHub Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file .release-note.md \
            ./release-assets/wwwallet-${TAG}.apk \
            ./release-assets/wwwallet-debug-${TAG}.apk

      - name: Write service account key
        run: |
          mkdir -p ~/.android
          echo "$GCP_JSON_KEY" > ~/.android/sirosid-fastlane.json
          chmod 600 ~/.android/sirosid-fastlane.json

      - name: Build Android App Bundle (AAB)
        env:
          WWWALLET_ANDROID_KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
          WWWALLET_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
          WWWALLET_ANDROID_KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
          WWWALLET_ANDROID_STORE_PASSWORD: ${{ secrets.PLAYSTORE_KEYSTORE_PASSWORD }}
          WWWALLET_ANDROID_STORE_B64: ${{ secrets.PLAYSTORE_SIGNING_KEYSTORE_B64 }}
        run: ./gradlew bundleRelease

      - name: Deploy to Google Play
        env:
          PLAY_STORE_AAB_PATH: ./wrapper/build/outputs/bundle/release/wrapper-release.aab
        run: fastlane android deploy_to_play_store
